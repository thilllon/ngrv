name: Bug report
description: Report a reproducible NGRV problem
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the NGRV and Node.js versions, commands, and a minimal example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
